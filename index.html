<meta name="mobile-web-app-capable" content="yes">

<title>Exercices d'anglais</title>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage.woff2) format('woff2');font-weight:200 800;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url(fonts/plex-sans-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url(fonts/plex-sans-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url(fonts/plex-sans-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(fonts/plex-mono-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(fonts/plex-mono-500.woff2) format('woff2');font-weight:500;font-display:swap}
/* Layout: one column notebook. Three tabs (Vocabulaire, Temps et verbes, Mes progrès). Config opens under the chosen fiche. Quiz = one card at a time. */
:root{
  --bg:#f1f5f7; --surface:#ffffff; --fg:#13202a; --muted:#566874; --line:#d6e0e5;
  --accent:#0a7983; --accent-fg:#ffffff; --accent-soft:#dcf0f1;
  --ok:#1b7a4a; --ok-soft:#dcf3e6; --bad:#b3364a; --bad-soft:#f9e2e6; --mid:#c9a227;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a21; --surface:#15252e; --fg:#e5eef2; --muted:#93a8b3; --line:#27404c;
  --accent:#52c4cd; --accent-fg:#06262a; --accent-soft:#16363d;
  --ok:#5fd394; --ok-soft:#163a29; --bad:#ff8a9b; --bad-soft:#42202a; --mid:#e0bd45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a21; --surface:#15252e; --fg:#e5eef2; --muted:#93a8b3; --line:#27404c;
  --accent:#52c4cd; --accent-fg:#06262a; --accent-soft:#16363d;
  --ok:#5fd394; --ok-soft:#163a29; --bad:#ff8a9b; --bad-soft:#42202a; --mid:#e0bd45; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;letter-spacing:-.01em}
.eyebrow{font:500 .75rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);margin:8px 0 0;max-width:60ch}
.nav{display:flex;gap:6px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tab{flex:1;padding:10px 8px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:600 .92rem var(--font-body);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sync{margin:-12px 0 0;font:500 .72rem var(--font-mono);color:var(--muted)}
#home,#stats{display:flex;flex-direction:column;gap:24px}
.group{display:flex;flex-direction:column;gap:8px}
.group>h2,.sec h2{font:500 .75rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--line)}
.deck{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:inherit;font:inherit;cursor:pointer}
.deck:hover{border-color:var(--accent)}
.deck[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.deck h3{font-size:1.05rem;font-weight:700}
.deck p{margin:0;color:var(--muted);font-size:.9rem;grid-column:1}
.deck .meta{grid-column:2;grid-row:1 / span 2;align-self:center;text-align:right;font:500 .75rem var(--font-mono);color:var(--muted)}
.deck .meta b{display:block;font-size:1.1rem;color:var(--fg)}
.deck .mini{grid-column:1 / -1;margin-top:8px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.config{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:16px}
.config h4{margin:0 0 8px;font:500 .75rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 .9rem var(--font-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn{padding:12px 20px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font:600 1rem var(--font-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{font:.85rem var(--font-mono);color:var(--muted)}
/* memo */
details.memo{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
details.memo summary{cursor:pointer;font:600 1rem var(--font-body)}
.scroll{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td:first-child{font-weight:600;white-space:nowrap}
/* quiz */
.quiz,.result{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 .8rem var(--font-mono);color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.tag{display:inline-block;font:500 .72rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.prompt{font:700 clamp(1.4rem,5vw,1.9rem)/1.25 var(--font-display);overflow-wrap:anywhere}
.sub{color:var(--muted);margin:-6px 0 0}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--fg)}
.fields{display:grid;gap:12px}
.field label{display:block;font:500 .75rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.field .wrap{position:relative}
.field input{width:100%;min-height:68px;padding:16px 56px 16px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:1.5rem var(--font-body);touch-action:manipulation}
.field .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1.4rem;cursor:pointer}
.field .clr[hidden]{display:none}
.field input.ok{border-color:var(--ok);background:var(--ok-soft)}
.field input.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb b{font-weight:600}
.fb div{margin-top:4px}
.fb .ex{color:var(--muted);font-size:.9rem}
.score{font:700 clamp(2.6rem,12vw,4rem)/1 var(--font-display)}
.score small{font-size:.4em;color:var(--muted);font-weight:500}
.miss{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.miss li{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.miss .q{font-weight:600;overflow-wrap:anywhere}
.miss .a{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
/* stats */
.sec{display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile b{display:block;font:700 1.8rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tile span{font:500 .72rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.s-m{background:var(--ok)} .s-l{background:var(--accent)} .s-w{background:var(--bad)}
.dk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dk .t{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.dk .t span:last-child{font:500 .78rem var(--font-mono);color:var(--muted);white-space:nowrap}
.dk .lg{font:.75rem var(--font-mono);color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;padding:8px 8px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.chart div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%}
.chart i{display:block;width:100%;max-width:26px;border-radius:3px 3px 0 0;min-height:3px}
.chart small{font:.62rem var(--font-mono);color:var(--muted)}
.hist{display:flex;flex-direction:column;margin:0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .d{font:.75rem var(--font-mono);color:var(--muted)}
.hist .n{overflow-wrap:anywhere}
.hist .n small{display:block;color:var(--muted);font-size:.8rem}
.hist .p{font:600 .95rem var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ver{font:500 .7rem var(--font-mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px;min-height:32px;cursor:pointer}
.ver.ok{color:var(--ok);border-color:var(--ok)}
</style>

</head>
<body>
<main>
  <header>
    <div class="topline"><div class="eyebrow">Révision · 4 fiches</div><button type="button" class="ver" id="ver" aria-live="polite"></button></div>
    <h1>Exercices d'anglais</h1>
    <p class="lead">Vocabulaire de tes fiches TEDx, thèse et 1000 mots, exercices sur les temps et les verbes, et suivi de tes progrès. Les questions déjà vues reviennent en dernier, tes erreurs reviennent en premier.</p>
  </header>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <p class="sync" id="sync"></p>
  <section id="home"></section>
  <section id="stats" hidden></section>
  <section id="quiz" hidden></section>
  <section id="result" hidden></section>
</main>

  const e = document.createElement(tag);
  for (const k in (props||{})) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k.startsWith('aria-') && typeof v === 'boolean') e.setAttribute(k, String(v));
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}

const norm = s => s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.,;:!?"“”]/g,'').replace(/-/g,' ').replace(/\s+/g,' ').trim();
function variants(en){
  const out = new Set();
  en.split(' / ').forEach(p => {
    p = p.trim(); out.add(p);
    const np = p.replace(/\s*\(.*?\)/g,'').trim(); out.add(np);
    [p,np].forEach(x => out.add(x.replace(/^(to|a|an|the) /i,'')));
  });
  return [...out].map(norm);
}

/* items[deckId][key] = [asked, lastWrong(0/1), rightCount, streak, lastTs]; sessions = [{t,d,m,s,n}]; reset = {deckId|'*': ts} */
const PKEY = 'prog:v2';
function migrateOld(){
  const p = {items:{}, sessions:[], reset:{}};
  DECKS.forEach(d => { try { const o = JSON.parse(localStorage.getItem('hist:'+d.id));
    if (o) { p.items[d.id] = {}; for (const k in o) { const a=o[k][0], w=o[k][1]; p.items[d.id][k] = [a, w, w ? Math.max(a-1,0) : a, w ? 0 : Math.min(a,1), 0]; } } } catch(e){} });
  return p;
}
function loadLocal(){
  try { const j = JSON.parse(localStorage.getItem(PKEY)); if (j && j.items) { j.sessions = j.sessions||[]; j.reset = j.reset||{}; return j; } } catch(e){}
  return migrateOld();
}
let prog = loadLocal();
function saveLocal(){ try { localStorage.setItem(PKEY, JSON.stringify(prog)); } catch(e){} }
const eff = (p, d) => Math.max((p.reset && p.reset[d]) || 0, (p.reset && p.reset['*']) || 0);
function merge(remote){
  if (!remote || typeof remote !== 'object') return;
  const R0 = remote.items || {}, rs = remote.sessions || [], rr = remote.reset || {};
  const rem = {reset: rr};
  const ids = new Set([...Object.keys(prog.items), ...Object.keys(R0)]);
  ids.forEach(id => {
    const a = eff(prog, id), b = eff(rem, id), L = prog.items[id] || {}, R = R0[id] || {};
    if (a > b) prog.items[id] = L;
    else if (b > a) prog.items[id] = R;
    else { const out = {...L}; for (const k in R) { const l = out[k], r = R[k]; if (!l || r[0] > l[0] || (r[0] === l[0] && r[4] > l[4])) out[k] = r; } prog.items[id] = out; }
  });
  new Set([...Object.keys(prog.reset), ...Object.keys(rr)]).forEach(k => prog.reset[k] = Math.max(prog.reset[k]||0, rr[k]||0));
  const seen = new Set(prog.sessions.map(s => s.t + s.d));
  rs.forEach(s => { if (!seen.has(s.t + s.d)) prog.sessions.push(s); });
  const cut = prog.reset['*'] || 0;
  prog.sessions = prog.sessions.filter(s => s.t >= cut).sort((x,y) => x.t - y.t).slice(-300);
}
let sync = 'local', cloudDoc = null, pushing = false, pushAgain = false, pushTimer = null;
function setSync(v){ sync = v; const el = $('#sync'); if (!el) return;
  el.textContent = v === 'cloud' ? 'Progrès synchronisés avec ton compte : tu les retrouves sur tous tes appareils.'
    : v === 'error' ? 'Synchronisation impossible pour le moment. Tes progrès restent sur cet appareil.'
    : 'Progrès enregistrés sur cet appareil. Pense à exporter une sauvegarde dans Mes progrès.'; }
async function pushCloud(){
  if (!cloudDoc) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  try { await cloudDoc.set({v:2, items:prog.items, sessions:prog.sessions, reset:prog.reset}); setSync('cloud'); }
  catch(e){ setSync('error'); }
  pushing = false;
  if (pushAgain) { pushAgain = false; pushCloud(); }
}
function schedulePush(){ saveLocal(); clearTimeout(pushTimer); pushTimer = setTimeout(pushCloud, 2000); }
async function initCloud(){
  setSync('local');
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    cloudDoc = db.collection('data/users/' + id).doc('progress');
    const snap = await cloudDoc.get();
    if (snap.exists) { merge(snap.data()); saveLocal(); refreshView(); }
    setSync('cloud');

function record(deckId, key, ok){
  if (!key) return;
  const m = prog.items[deckId] || (prog.items[deckId] = {});
  const r = m[key] || [0,0,0,0,0];
  m[key] = [r[0]+1, ok ? 0 : 1, r[2] + (ok ? 1 : 0), ok ? r[3]+1 : 0, Date.now()];
  schedulePush();
}
function logSession(){
  if (!quiz || quiz.logged || !quiz.results.length) return;
  quiz.logged = true;
  prog.sessions.push({t:Date.now(), d:quiz.id, m:quiz.retry ? 'retry' : quiz.mode, s:quiz.results.filter(r => r.ok).length, n:quiz.results.length});
  prog.sessions = prog.sessions.slice(-300);
  schedulePush();
}
function statusOf(deckId, key){
  const r = prog.items[deckId] && prog.items[deckId][key];
  if (!r) return 'new';
  if (r[1]) return 'wrong';
  return r[3] >= 3 ? 'mastered' : 'learning';
}
function deckStats(d){
  const c = {mastered:0, learning:0, wrong:0, new:0};
  d.items.forEach(it => c[statusOf(d.id, itemKey(it))]++);
  return c;
}
function lastSession(id){ for (let i = prog.sessions.length-1; i >= 0; i--) if (prog.sessions[i].d === id) return prog.sessions[i]; return null; }
function pick(deck, n){
  const m = prog.items[deck.id] || {};
  return deck.items.map(it => { const r = m[itemKey(it)]; const asked = r ? r[0] : 0, wrong = r ? r[1] : 0;
    return { it, s: asked - (wrong ? 1.5 : 0) + Math.random()*1.2 }; })
    .sort((a,b) => a.s - b.s).slice(0, n).map(x => x.it);

function choiceQ(tag, prompt, sub, correct, pool, explain, info){
  const wrong = shuffle([...new Set(pool.filter(x => x !== correct))]).slice(0,5);
  const options = shuffle([correct, ...wrong]);
  return { type:'choice', tag, prompt, sub, options, correct: options.indexOf(correct), explain, answerText: correct, info };
}
function makeVocabQ(deck, it, mode){
  const [en, fr, s] = it;
  const frs = deck.items.map(x => x[1]), ens = deck.items.map(x => x[0]);
  const full = s ? 'Exemple : ' + s : '';
  const ans = en + ' — ' + fr;
  const byFr = new Map(deck.items.map(x => [x[1], x])), byEn = new Map(deck.items.map(x => [x[0], x]));
  const lookup = t => {
    const n = norm(t); if (!n) return null;
    const x = deck.items.find(y => variants(y[0]).includes(n) || norm(keyOf(y)) === n);
    return x ? '« ' + t.trim() + ' » = ' + x[1] : '« ' + t.trim() + ' »';
  };
  if (mode === 'en-fr') { const q = choiceQ('EN → FR', en, 'Choisis la traduction.', fr, frs, full,
    o => { const x = byFr.get(o); return x ? '« ' + o + ' » = ' + x[0] : '« ' + o + ' »'; }); q.answerText = ans; return q; }
  if (mode === 'fr-en') { const q = choiceQ('FR → EN', fr, 'Choisis le mot anglais.', en, ens, full,
    o => { const x = byEn.get(o); return x ? '« ' + o + ' » = ' + x[1] : '« ' + o + ' »'; }); q.answerText = ans; return q; }
  if (mode === 'write') {
    const base = variants(en);
    const hint = base[base.length-1] || base[0];
    return { type:'type', tag:'Écrire', prompt: fr, sub:'Écris en anglais.',
      fields:[{label:'Anglais', answers: base}], explain: full, answerText: ans, info: lookup,
      hint: hint[0] + ' … (' + hint.replace(/ /g,'').length + ' lettres)' };
  }
  const c = clozeOf(it);
  const accept = [norm(keyOf(it)), ...variants(en)];
  return { type:'type', tag:'Phrase à trous', prompt: c, sub:'Sens du mot manquant : ' + fr,
    fields:[{label:'Mot manquant', answers: accept}], explain: full, answerText: ans, info: lookup,
    hint: keyOf(it)[0] + ' … (' + keyOf(it).replace(/ /g,'').length + ' lettres)' };
}
const GLOSS = {'unless':'à moins que','because':'parce que','although':'bien que','so':'donc, alors','therefore':'par conséquent','whereas':'alors que','despite':'malgré','because of':'à cause de','so that':'pour que','in case':'au cas où','as long as':'du moment que','otherwise':'sinon','moreover':'de plus, en outre','instead':'à la place','meanwhile':'pendant ce temps','in order to':'afin de','besides':'d\'ailleurs, en outre','however':'cependant','overall':'dans l\'ensemble','due to':'en raison de','thanks to':'grâce à','nonetheless':'néanmoins','even if':'même si','whether':'si (choix entre deux possibilités)','next':'ensuite','especially':'surtout','since':'puisque','on condition that':'à la condition que','so as':'afin (de)','finally':'enfin','so … that':'si… que','such … that':'tel… que'};
function questionsFor(deck, mode, items){
  return items.map(it => {
    let q;
    if (deck.kind === 'qcm') {
      const right = it.o[it.a], opts = shuffle(it.o);
      const gl = deck.id === 'connecteurs' ? (o => GLOSS[o.toLowerCase()]) : (() => null);
      q = { type:'choice', tag: deck.tag || 'Question', prompt:it.p, sub:'Choisis la bonne réponse.',
        options: opts, correct: opts.indexOf(right), explain:it.e,
        answerText: right + (gl(right) ? ' — ' + gl(right) : ''),
        info: o => '« ' + o + ' »' + (gl(o) ? ' = ' + gl(o) : '') };
    } else if (deck.kind === 'verbs') {
      q = { type:'type', tag:'Verbe irrégulier', prompt:it[0], sub:it[1],
        fields:[{label:'Prétérit', answers:variants(it[2])},{label:'Participe passé', answers:variants(it[3])}],
        explain: it[0]+' – '+it[2]+' – '+it[3]+'  ('+it[1]+')', answerText: it[2]+' · '+it[3],
        hint: it[2][0]+' … / '+it[3][0]+' …' };
    } else if (deck.kind === 'conj') {
      q = { type:'type', tag: deck.tag || 'Conjugaison', prompt:it[0], sub:it[1],
        fields:[{label:'Ta réponse', answers: it[2].map(norm)}], explain: it[3], answerText: it[2][0],
        hint: it[2][0].split(' ')[0].slice(0,1) + ' … (' + it[2][0].split(' ').length + ' mot' + (it[2][0].split(' ').length > 1 ? 's' : '') + ')' };
    } else {
      let m = mode;
      if (m === 'mix') { const opts = ['en-fr','fr-en','write'].concat(clozeOf(it) ? ['cloze','cloze'] : []); m = opts[Math.floor(Math.random()*opts.length)]; }
      if (m === 'cloze' && !clozeOf(it)) m = 'write';
      q = makeVocabQ(deck, it, m);
    }
    q.key = itemKey(it); q.deckId = deck.id;
    return q;
  });
}
function buildQuiz(deck, mode, count){ return questionsFor(deck, mode, shuffle(pick(deck, count || deck.items.length))); }

  const again = quiz.again, id = quiz.id, title = quiz.title;
  if (missed.length) row.append(h('button', {class:'btn', onclick(){
    runQuiz({qs: missed.map(r => r.q), id, title, mode:'', again, retry:true});
  }}, 'Refaire les erreurs'));
  row.append(h('button', {class:missed.length?'btn ghost':'btn', onclick: again}, 'Nouvelle série'),
    h('button', {class:'btn ghost', onclick(){ quiz = null; setTab(state.tab === 'stats' ? 'stats' : state.tab); }}, 'Retour'));
  card.append(row); box.append(card); show('result');
}

const APP_VERSION='9051bef8', APP_DATE='30/10/2026';
(function(){
  const b = document.getElementById('ver'); if (!b) return;
  const label = (x) => { b.textContent = x; };
  label('\u21BB v' + APP_DATE);
  b.setAttribute('aria-label', 'Vérifier la mise à jour. Version du ' + APP_DATE);
  b.onclick = async () => {
    label('Vérification…'); b.classList.remove('ok');
    try {
      const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'}); const j = await r.json();
      if (j.v === APP_VERSION) { label('\u2713 À jour · ' + APP_DATE); b.classList.add('ok'); return; }
      label('Mise à jour…');
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg) { navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), {once:true}); await reg.update(); }
      setTimeout(() => location.reload(), 4000);
    } catch(e) { label('Hors ligne · ' + APP_DATE); }
  };
})();
renderNav(); renderHome(); show('home'); setSync('local'); initCloud();
</script>
