<style>
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage.woff2) format('woff2');font-weight:200 800;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url(fonts/plex-sans-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url(fonts/plex-sans-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url(fonts/plex-sans-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(fonts/plex-mono-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(fonts/plex-mono-500.woff2) format('woff2');font-weight:500;font-display:swap}
/* Layout: one column notebook. Three tabs (Vocabulaire, Temps et verbes, Mes progrès). Config opens under the chosen fiche. Quiz = one card at a time. */
:root{
  --bg:#f1f5f7; --surface:#ffffff; --fg:#13202a; --muted:#566874; --line:#d6e0e5;
  --accent:#0a7983; --accent-fg:#ffffff; --accent-soft:#dcf0f1;
  --ok:#1b7a4a; --ok-soft:#dcf3e6; --bad:#b3364a; --bad-soft:#f9e2e6; --mid:#c9a227;
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1a21; --surface:#15252e; --fg:#e5eef2; --muted:#93a8b3; --line:#27404c;
  --accent:#52c4cd; --accent-fg:#06262a; --accent-soft:#16363d;
  --ok:#5fd394; --ok-soft:#163a29; --bad:#ff8a9b; --bad-soft:#42202a; --mid:#e0bd45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a21; --surface:#15252e; --fg:#e5eef2; --muted:#93a8b3; --line:#27404c;
  --accent:#52c4cd; --accent-fg:#06262a; --accent-soft:#16363d;
  --ok:#5fd394; --ok-soft:#163a29; --bad:#ff8a9b; --bad-soft:#42202a; --mid:#e0bd45; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;letter-spacing:-.01em}
.eyebrow{font:500 .75rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);margin:8px 0 0;max-width:60ch}
.nav{display:flex;gap:6px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tab{flex:1;padding:10px 8px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:600 .92rem var(--font-body);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sync{margin:-12px 0 0;font:500 .72rem var(--font-mono);color:var(--muted)}
#home,#stats{display:flex;flex-direction:column;gap:24px}
.group{display:flex;flex-direction:column;gap:8px}
.group>h2,.sec h2{font:500 .75rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--line)}
.deck{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:inherit;font:inherit;cursor:pointer}
.deck:hover{border-color:var(--accent)}
.deck[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.deck h3{font-size:1.05rem;font-weight:700}
.deck p{margin:0;color:var(--muted);font-size:.9rem;grid-column:1}
.deck .meta{grid-column:2;grid-row:1 / span 2;align-self:center;text-align:right;font:500 .75rem var(--font-mono);color:var(--muted)}
.deck .meta b{display:block;font-size:1.1rem;color:var(--fg)}
.deck .mini{grid-column:1 / -1;margin-top:8px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.config{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:16px}
.config h4{margin:0 0 8px;font:500 .75rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 .9rem var(--font-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn{padding:12px 20px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font:600 1rem var(--font-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{font:.85rem var(--font-mono);color:var(--muted)}
/* memo */
details.memo{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
details.memo summary{cursor:pointer;font:600 1rem var(--font-body)}
.scroll{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td:first-child{font-weight:600;white-space:nowrap}
/* quiz */
.quiz,.result{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 .8rem var(--font-mono);color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.tag{display:inline-block;font:500 .72rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.prompt{font:700 clamp(1.4rem,5vw,1.9rem)/1.25 var(--font-display);overflow-wrap:anywhere}
.sub{color:var(--muted);margin:-6px 0 0}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--fg)}
.fields{display:grid;gap:12px}
.field label{display:block;font:500 .75rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:1.1rem var(--font-body)}
.field input.ok{border-color:var(--ok);background:var(--ok-soft)}
.field input.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb b{font-weight:600}
.fb div{margin-top:4px}
.fb .ex{color:var(--muted);font-size:.9rem}
.score{font:700 clamp(2.6rem,12vw,4rem)/1 var(--font-display)}
.score small{font-size:.4em;color:var(--muted);font-weight:500}
.miss{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.miss li{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.miss .q{font-weight:600;overflow-wrap:anywhere}
.miss .a{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
/* stats */
.sec{display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile b{display:block;font:700 1.8rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tile span{font:500 .72rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.s-m{background:var(--ok)} .s-l{background:var(--accent)} .s-w{background:var(--bad)}
.dk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dk .t{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.dk .t span:last-child{font:500 .78rem var(--font-mono);color:var(--muted);white-space:nowrap}
.dk .lg{font:.75rem var(--font-mono);color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;padding:8px 8px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.chart div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%}
.chart i{display:block;width:100%;max-width:26px;border-radius:3px 3px 0 0;min-height:3px}
.chart small{font:.62rem var(--font-mono);color:var(--muted)}
.hist{display:flex;flex-direction:column;margin:0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .d{font:.75rem var(--font-mono);color:var(--muted)}
.hist .n{overflow-wrap:anywhere}
.hist .n small{display:block;color:var(--muted);font-size:.8rem}
.hist .p{font:600 .95rem var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

</head>

const PKEY = 'prog:v2';
function migrateOld(){
  const p = {items:{}, sessions:[], reset:{}};
  DECKS.forEach(d => { try { const o = JSON.parse(localStorage.getItem('hist:'+d.id));
    if (o) { p.items[d.id] = {}; for (const k in o) { const a=o[k][0], w=o[k][1]; p.items[d.id][k] = [a, w, w ? Math.max(a-1,0) : a, w ? 0 : Math.min(a,1), 0]; } } } catch(e){} });
  return p;
}

  try { const j = JSON.parse(localStorage.getItem(PKEY)); if (j && j.items) { j.sessions = j.sessions||[]; j.reset = j.reset||{}; return j; } } catch(e){}
  return migrateOld();
}

const eff = (p, d) => Math.max((p.reset && p.reset[d]) || 0, (p.reset && p.reset['*']) || 0);
function merge(remote){
  if (!remote || typeof remote !== 'object') return;
  const R0 = remote.items || {}, rs = remote.sessions || [], rr = remote.reset || {};
  const rem = {reset: rr};
  const ids = new Set([...Object.keys(prog.items), ...Object.keys(R0)]);
  ids.forEach(id => {
    const a = eff(prog, id), b = eff(rem, id), L = prog.items[id] || {}, R = R0[id] || {};
    if (a > b) prog.items[id] = L;
    else if (b > a) prog.items[id] = R;
    else { const out = {...L}; for (const k in R) { const l = out[k], r = R[k]; if (!l || r[0] > l[0] || (r[0] === l[0] && r[4] > l[4])) out[k] = r; } prog.items[id] = out; }
  });
  new Set([...Object.keys(prog.reset), ...Object.keys(rr)]).forEach(k => prog.reset[k] = Math.max(prog.reset[k]||0, rr[k]||0));
  const seen = new Set(prog.sessions.map(s => s.t + s.d));
  rs.forEach(s => { if (!seen.has(s.t + s.d)) prog.sessions.push(s); });
  const cut = prog.reset['*'] || 0;
  prog.sessions = prog.sessions.filter(s => s.t >= cut).sort((x,y) => x.t - y.t).slice(-300);

      q = { type:'type', tag: deck.tag || 'Conjugaison', prompt:it[0], sub:it[1],
        fields:[{label:'Ta réponse', answers: it[2].map(norm)}], explain: it[3], answerText: it[2][0],
        hint: it[2][0].split(' ')[0].slice(0,1) + ' … (' + it[2][0].split(' ').length + ' mot' + (it[2][0].split(' ').length > 1 ? 's' : '') + ')' };
    } else {
      let m = mode;
      if (m === 'mix') { const opts = ['en-fr','fr-en','write'].concat(clozeOf(it) ? ['cloze','cloze'] : []); m = opts[Math.floor(Math.random()*opts.length)]; }
      if (m === 'cloze' && !clozeOf(it)) m = 'write';
      q = makeVocabQ(deck, it, m);
    }
    q.key = itemKey(it); q.deckId = deck.id;
    return q;
  });
}
function buildQuiz(deck, mode, count){ return questionsFor(deck, mode, shuffle(pick(deck, count || deck.items.length))); }

/* =============== views =============== */
const state = { tab:'vocab', deck:null, mode:'mix', count:10 };
const TABS = [['vocab','Vocabulaire'],['tv','Temps et verbes'],['stats','Mes progrès']];
let quiz = null;
function show(view){
  ['home','stats','quiz','result'].forEach(v => $('#'+v).hidden = v !== view);
  $('#nav').hidden = view === 'quiz' || view === 'result';
  $('#sync').hidden = view === 'quiz' || view === 'result';
  window.scrollTo(0,0);
}
function renderNav(){
  const nav = $('#nav'); nav.replaceChildren();
  TABS.forEach(([k,l]) => nav.append(h('button', {class:'tab', 'aria-pressed': state.tab === k, onclick(){ setTab(k); }}, l)));
}
function setTab(t){
  state.tab = t; state.deck = null; renderNav();
  if (t === 'stats') { renderStats(); show('stats'); } else { renderHome(); show('home'); }
}
function refreshView(){ if (!$('#quiz').hidden || !$('#result').hidden) return; if (state.tab === 'stats') renderStats(); else renderHome(); }

const configEl = h('div', {class:'config'});
function renderConfig(){
  const d = state.deck; configEl.replaceChildren();
  if (d.kind === 'vocab') {
    if (state.mode === 'cloze' && d.items.filter(clozeOf).length < 5) state.mode = 'mix';
    configEl.append(h('div', null, h('h4', null, 'Type d\'exercice'),
      h('div', {class:'chips'}, MODES.map(([k,l]) => h('button', {class:'chip', 'aria-pressed': state.mode===k, onclick(){ state.mode=k; renderConfig(); }}, l)))));
  }
  const counts = [[10,'10 questions'],[20,'20 questions'],[0,'Tout (' + d.items.length + ')']];
  configEl.append(h('div', null, h('h4', null, 'Longueur'),
    h('div', {class:'chips'}, counts.map(([k,l]) => h('button', {class:'chip', 'aria-pressed': state.count===k, onclick(){ state.count=k; renderConfig(); }}, l)))));
  const last = lastSession(d.id), tries = prog.sessions.filter(s => s.d === d.id).length;
  const resetBtn = h('button', {class:'btn ghost', onclick(){
    prog.reset[d.id] = Date.now(); delete prog.items[d.id]; schedulePush(); renderHome(); }}, 'Repartir de zéro');
  configEl.append(h('div', {class:'row'}, h('button', {class:'btn', onclick: start}, 'Commencer'), resetBtn));
  if (last) configEl.append(h('div', {class:'hint'}, 'Dernière tentative : ' + last.s + ' / ' + last.n + ' · ' + tries + ' tentative' + (tries > 1 ? 's' : '')));
}
function selectDeck(d, row, keep){
  state.deck = d; if (!keep) { state.mode = 'mix'; state.count = 10; }
  document.querySelectorAll('.deck').forEach(b => b.setAttribute('aria-pressed', b === row));
  renderConfig(); row.after(configEl);
}
const MEMO = [
  ['Présent simple','sujet + base (+ s à la 3e pers.)','every day, usually, always, often','She works every day.'],
  ['Présent continu','am / is / are + V-ing','now, at the moment, this week, Look!','I am working now.'],
  ['Past simple','V-ed ou forme irrégulière','yesterday, last year, ago, in 2019','She visited Rome last year.'],
  ['Past continuous','was / were + V-ing','while, when (action interrompue)','I was reading when you called.'],
  ['Present perfect','have / has + participe passé','ever, never, just, already, yet, for, since','I have been to New York.'],
  ['Futur avec will','will + base','décision spontanée, promesse, prévision sans preuve','I will help you.'],
  ['Be going to','am / is / are going to + base','intention décidée, prévision avec indice','It is going to rain.'],
  ['Futur planifié','présent continu','agenda, rendez-vous, voyage','We are leaving tomorrow.'],
  ['Horaire officiel','présent simple','trains, programmes','The train leaves at 6 pm.'],
  ['Future continuous','will be + V-ing','à tel moment futur','At 8 I will be working.'],
  ['Future perfect','will have + participe passé','by + date','By next year I will have graduated.'],
  ['Future perfect continuous','will have been + V-ing','by noon, for 5 hours','By noon I will have been driving for 6 hours.']
];
function memoEl(){
  return h('details', {class:'memo'}, h('summary', null, 'Mémo des temps (cours avec Joseph)'),
    h('div', {class:'scroll'}, h('table', null,
      h('thead', null, h('tr', null, ['Temps','Forme','Indices','Exemple'].map(x => h('th', null, x)))),
      h('tbody', null, MEMO.map(r => h('tr', null, r.map(x => h('td', null, x))))))));
}
function renderHome(){
  const home = $('#home'); home.replaceChildren();
  const decks = DECKS.filter(d => (d.section || 'vocab') === state.tab);
  const groups = [...new Set(decks.map(d => d.group))];
  const rowOf = new Map();
  groups.forEach((g, gi) => {
    const box = h('div', {class:'group'}, h('h2', null, g));
    if (state.tab === 'tv' && gi === 0) box.append(memoEl());
    decks.filter(d => d.group === g).forEach(d => {
      const st = deckStats(d);
      const row = h('button', {class:'deck', 'aria-pressed':false, onclick(){ selectDeck(d, row); }},
        h('h3', null, d.title), h('p', null, d.desc),
        h('div', {class:'meta'}, h('b', null, String(d.items.length)), d.kind==='vocab'?'mots':d.kind==='verbs'?'verbes':d.kind==='conj'?'phrases':'questions'),
        h('div', {class:'mini'}, stackBar(st, d.items.length)));
      rowOf.set(d, row); box.append(row);
    });
    home.append(box);
  });
  const keep = !!state.deck && decks.includes(state.deck);
  const target = keep ? state.deck : decks[0];
  if (target) selectDeck(target, rowOf.get(target), keep);
}
function stackBar(st, total){
  const seg = (cls, n) => h('i', {class:cls, style:'width:' + (total ? n/total*100 : 0) + '%'});
  return h('div', {class:'stack', role:'img', 'aria-label': st.mastered + ' maîtrisés, ' + st.learning + ' en cours, ' + st.wrong + ' à revoir, ' + st.new + ' non vus'},
    seg('s-m', st.mastered), seg('s-l', st.learning), seg('s-w', st.wrong));
}

/* =============== stats =============== */
function describe(d, it){
  if (d.kind === 'vocab') return it[0] + ' — ' + it[1];
  if (d.kind === 'verbs') return it[0] + ' — ' + it[2] + ' — ' + it[3];
  if (d.kind === 'conj') return it[0] + '  →  ' + it[2][0];
  return it.p;
}
function wrongPool(){
  const pool = [];
  DECKS.forEach(d => { const m = prog.items[d.id] || {}; d.items.forEach(it => { const r = m[itemKey(it)]; if (r && r[1]) pool.push([d, it]); }); });
  return pool;
}
function fmtDate(t){ const x = new Date(t); return x.toLocaleDateString('fr-FR', {day:'numeric', month:'short'}) + ' ' + x.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}); }
function renderStats(){
  const box = $('#stats'); box.replaceChildren();
  const S = prog.sessions, N = S.reduce((a,s) => a + s.n, 0), C = S.reduce((a,s) => a + s.s, 0);
  let mast = 0, total = 0; DECKS.forEach(d => { const st = deckStats(d); mast += st.mastered; total += d.items.length; });
  box.append(h('div', {class:'tiles'},
    tile(String(S.length), 'Tentatives'), tile(String(N), 'Questions'),
    tile(N ? Math.round(C/N*100) + ' %' : '—', 'Réussite'), tile(mast + ' / ' + total, 'Maîtrisés')));
  if (!S.length) {
    box.append(h('div', {class:'empty'}, 'Aucune tentative pour l\'instant. Fais une première série : tes scores, tes mots maîtrisés et tes erreurs apparaîtront ici.'));
  } else {
    const last = S.slice(-14);
    box.append(h('div', {class:'sec'}, h('h2', null, 'Les ' + last.length + ' dernières tentatives'),
      h('div', {class:'chart', role:'img', 'aria-label':'Scores des dernières tentatives, de la plus ancienne à la plus récente'},
        last.map(s => { const p = Math.round(s.s/s.n*100);
          return h('div', {title: deckTitle(s.d) + ' : ' + s.s + '/' + s.n},
            h('i', {style:'height:' + Math.max(p,3) + '%;background:' + (p >= 80 ? 'var(--ok)' : p >= 50 ? 'var(--accent)' : 'var(--bad)')}), h('small', null, String(p))); })),
      h('div', {class:'hint'}, 'Score en %, de la plus ancienne (à gauche) à la plus récente.')));
    box.append(h('div', {class:'sec'}, h('h2', null, 'Historique'),
      h('ul', {class:'hist'}, S.slice(-12).reverse().map(s => h('li', null,
        h('span', {class:'d'}, fmtDate(s.t)),
        h('span', {class:'n'}, deckTitle(s.d), s.m && MODE_LABEL[s.m] ? h('small', null, MODE_LABEL[s.m]) : null),
        h('span', {class:'p'}, s.s + ' / ' + s.n))))));
  }
  const pool = wrongPool();
  const rev = h('div', {class:'sec'}, h('h2', null, 'À revoir (' + pool.length + ')'));
  if (pool.length) {
    rev.append(h('ul', {class:'miss'}, shuffle(pool).slice(0,10).map(([d,it]) => h('li', null,
      h('div', {class:'q'}, describe(d, it)), h('div', {class:'a'}, deckTitle(d.id))))));
    rev.append(h('div', {class:'row'}, h('button', {class:'btn', onclick: startReview}, 'Réviser mes erreurs'),
      pool.length > 10 ? h('span', {class:'hint'}, '10 affichées sur ' + pool.length) : null));
  } else rev.append(h('div', {class:'empty'}, 'Rien à revoir pour l\'instant.'));
  box.append(rev);
  const sec = h('div', {class:'sec'}, h('h2', null, 'Progression par série'));
  [['vocab','Vocabulaire'],['tv','Temps et verbes']].forEach(([k,l]) => {
    DECKS.filter(d => (d.section || 'vocab') === k).forEach(d => {
      const st = deckStats(d);
      sec.append(h('div', {class:'dk'},
        h('div', {class:'t'}, h('span', null, d.title), h('span', null, st.mastered + ' / ' + d.items.length + ' maîtrisés')),
        stackBar(st, d.items.length),
        h('div', {class:'lg'}, st.learning + ' en cours · ' + st.wrong + ' à revoir · ' + st.new + ' non vus')));
    });
  });
  sec.append(h('div', {class:'hint'}, 'Maîtrisé = 3 bonnes réponses d\'affilée. Vert : maîtrisé, turquoise : en cours, rouge : à revoir.'));
  box.append(sec);
  const wipe = h('button', {class:'btn ghost danger', onclick(){
    if (!wipe.dataset.sure) { wipe.dataset.sure = '1'; wipe.textContent = 'Confirmer : tout effacer'; return; }
    prog = {items:{}, sessions:[], reset:{'*':Date.now()}}; saveLocal(); clearTimeout(pushTimer); pushCloud(); renderStats(); }}, 'Effacer tout mon historique');
  box.append(h('div', {class:'row'}, wipe));
  box.append(backupBox());
}
function backupBox(){
  const msg = h('p', {class:'hint', role:'status'});
  const file = h('input', {type:'file', accept:'application/json,.json', hidden:true, onchange(){
    const f = file.files[0]; if (!f) return;
    f.text().then(txt => { const j = JSON.parse(txt); if (!j || !j.items) throw 0; merge(j); saveLocal(); renderStats(); })
      .catch(() => { msg.textContent = 'Fichier non reconnu.'; }); }});
  return h('div', {class:'sec'}, h('h3', null, 'Sauvegarde'),
    h('p', {class:'hint'}, 'Tes progrès sont stockés sur cet iPhone. Exporte un fichier de sauvegarde de temps en temps, et importe-le pour les retrouver sur un autre appareil.'),
    h('div', {class:'row'},
      h('button', {class:'btn ghost', onclick(){
        const blob = new Blob([JSON.stringify({v:2, items:prog.items, sessions:prog.sessions, reset:prog.reset})], {type:'application/json'});
        const a = h('a', {href:URL.createObjectURL(blob), download:'progres-anglais-' + new Date().toISOString().slice(0,10) + '.json'});
        document.body.append(a); a.click(); a.remove(); msg.textContent = 'Sauvegarde exportée.'; }}, 'Exporter mes progrès'),
      h('button', {class:'btn ghost', onclick(){ file.click(); }}, 'Importer une sauvegarde'), file), msg);
}
function tile(v, l){ return h('div', {class:'tile'}, h('b', null, v), h('span', null, l)); }

/* =============== quiz =============== */
function runQuiz(o){
  quiz = {qs:o.qs, i:0, results:[], id:o.id, title:o.title, mode:o.mode || '', again:o.again, retry:!!o.retry, logged:false};
  show('quiz'); showQ();
}
function start(){
  const d = state.deck;
  runQuiz({qs: buildQuiz(d, state.mode, state.count), id:d.id, title:d.title, mode: d.kind === 'vocab' ? state.mode : '', again:start});
}
function startReview(){
  const chosen = shuffle(wrongPool()).slice(0,20);
  if (!chosen.length) return;
  runQuiz({qs: chosen.map(([d,it]) => questionsFor(d, 'mix', [it])[0]), id:'review', title:'Révision des erreurs', mode:'', again:startReview});
}
function showQ(){
  const q = quiz.qs[quiz.i], box = $('#quiz'); box.replaceChildren();
  const card = h('div', {class:'quiz'});
  card.append(h('div', {class:'top'}, h('span', null, 'Question ' + (quiz.i+1) + ' / ' + quiz.qs.length),
    h('button', {class:'chip', onclick: quit}, 'Quitter')));
  card.append(h('div', {class:'bar', role:'progressbar', 'aria-valuemin':0, 'aria-valuemax':quiz.qs.length, 'aria-valuenow':quiz.i}, h('i', {style:'width:'+(quiz.i/quiz.qs.length*100)+'%'})));
  card.append(h('div', null, h('span', {class:'tag'}, q.tag)));
  card.append(h('div', {class:'prompt'}, q.prompt));
  card.append(h('p', {class:'sub'}, q.sub));
  const fb = h('div', {'aria-live':'polite'});
  let answered = false;
  const nextBtn = h('button', {class:'btn', onclick: next}, quiz.i === quiz.qs.length-1 ? 'Voir le score' : 'Suivant');
  nextBtn.hidden = true;
  const finish = (ok, given, extra) => {
    answered = true; quiz.results.push({q, ok, given}); record(q.deckId, q.key, ok);
    fb.replaceChildren(h('div', {class:'fb ' + (ok?'ok':'bad')},
      h('b', null, ok ? 'Correct.' : 'Pas tout à fait.'),
      ok ? null : h('div', null, 'Bonne réponse : ', h('b', null, q.answerText)),
      (!ok && extra) ? h('div', null, 'Ta réponse : ' + extra) : null,
      q.explain ? h('div', {class:'ex'}, q.explain) : null));
    nextBtn.hidden = false; nextBtn.focus();
  };
  if (q.type === 'choice') {
    const opts = h('div', {class:'opts'});
    q.options.forEach((o, idx) => {
      const b = h('button', {class:'opt', onclick(){
        if (answered) return;
        opts.querySelectorAll('button').forEach((x,j) => { x.disabled = true; if (j===q.correct) x.classList.add('ok'); });
        if (idx !== q.correct) b.classList.add('bad');
        finish(idx === q.correct, o, q.info ? q.info(o) : '« ' + o + ' »');
      }}, o);
      opts.append(b);
    });
    card.append(opts, fb, h('div', {class:'row'}, nextBtn));
  } else {
    const fields = h('div', {class:'fields'});
    const inputs = q.fields.map((f, i) => {
      const inp = h('input', {id:'f'+i, type:'text', autocomplete:'off', autocapitalize:'off', autocorrect:'off', spellcheck:'false'});
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); answered ? next() : check(); } });
      fields.append(h('div', {class:'field'}, h('label', {for:'f'+i}, f.label), inp));
      return inp;
    });
    const hint = h('div', {class:'hint'});
    const checkBtn = h('button', {class:'btn', onclick: check}, 'Valider');
    const hintBtn = h('button', {class:'btn ghost', onclick(){ hint.textContent = 'Indice : ' + q.hint; }}, 'Indice');
    function check(){
      if (answered) return;
      let all = true;
      inputs.forEach((inp, i) => {
        const ok = q.fields[i].answers.includes(norm(inp.value));
        inp.classList.add(ok ? 'ok' : 'bad'); inp.readOnly = true; if (!ok) all = false;
      });
      checkBtn.hidden = true; hintBtn.hidden = true;
      const typed = inputs.map(i => i.value).join(' · ');
      finish(all, typed, (!all && q.info && inputs[0].value.trim()) ? (q.fields.length === 1 ? q.info(inputs[0].value) : typed) : (!all && inputs[0].value.trim() ? '« ' + typed + ' »' : null));
    }
    card.append(fields, hint, fb, h('div', {class:'row'}, checkBtn, hintBtn, nextBtn));
    setTimeout(() => inputs[0].focus(), 0);
  }
  box.append(card);
}
function next(){
  quiz.i++;
  if (quiz.i >= quiz.qs.length) return showResult();
  showQ(); window.scrollTo(0,0);
}
function quit(){
  logSession(); quiz = null;
  if (state.tab === 'stats') { renderStats(); show('stats'); } else { renderHome(); show('home'); }
}
function showResult(){
  logSession();
  const box = $('#result'); box.replaceChildren();
  const good = quiz.results.filter(r => r.ok).length, total = quiz.results.length;
  const missed = quiz.results.filter(r => !r.ok);
  const pct = Math.round(good/total*100);
  const msg = pct >= 90 ? 'Très solide.' : pct >= 70 ? 'Bonne base, reste quelques points à fixer.' : pct >= 50 ? 'En progrès. Refais les erreurs pour les ancrer.' : 'Ça demande encore du travail. Refais les erreurs, puis une nouvelle série.';
  const card = h('div', {class:'result'},
    h('div', {class:'eyebrow'}, quiz.title),
    h('div', {class:'score'}, String(good), h('small', null, ' / ' + total)),
    h('p', {class:'sub'}, msg));
  if (missed.length) {
    card.append(h('h3', null, 'À revoir (' + missed.length + ')'),
      h('ul', {class:'miss'}, missed.map(r => h('li', null,
        h('div', {class:'q'}, r.q.prompt),
        h('div', {class:'a'}, 'Réponse : ' + r.q.answerText + (r.given ? '   (ta réponse : ' + r.given + ')' : ''))))));
  }
  const row = h('div', {class:'row'});
  const again = quiz.again, id = quiz.id, title = quiz.title;
  if (missed.length) row.append(h('button', {class:'btn', onclick(){
    runQuiz({qs: missed.map(r => r.q), id, title, mode:'', again, retry:true});
  }}, 'Refaire les erreurs'));
  row.append(h('button', {class:missed.length?'btn ghost':'btn', onclick: again}, 'Nouvelle série'),
    h('button', {class:'btn ghost', onclick(){ quiz = null; setTab(state.tab === 'stats' ? 'stats' : state.tab); }}, 'Retour'));
  card.append(row); box.append(card); show('result');
}

renderNav(); renderHome(); show('home'); setSync('local'); initCloud();
</script>
